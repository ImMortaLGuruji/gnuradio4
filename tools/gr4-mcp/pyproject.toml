[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gr4-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for GNU Radio 4 AI-driven development"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "GNU Radio 4 Contributors" }
]
dependencies = [
    "mcp>=1.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
gr4-mcp = "gr4_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gr4_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

